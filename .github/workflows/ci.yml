name: CI

# Minimal gate: lint/format + production build (+ dist hygiene).
# Playwright unit/e2e is expensive (~4 of ~5 CI minutes historically) and is
# not run here — use the "Playwright" workflow (workflow_dispatch) when needed.

on:
  push:
    branches: [main, master]
  pull_request:

# Labs dogfoods sibling wwl-* repos via link:../wwl-*. Check them out beside
# weekend-web-labs/ and build dist/ (gitignored) before install/build.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: weekend-web-labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: weekend-web-labs

      - name: Checkout wwl-cbun
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-cbun
          ref: main
          path: wwl-cbun

      - name: Checkout wwl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-ai-chat
          ref: main
          path: wwl-ai-chat

      - name: Checkout wwl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-hex-earth
          ref: main
          path: wwl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            weekend-web-labs/pnpm-lock.yaml
            wwl-cbun/pnpm-lock.yaml
            wwl-ai-chat/pnpm-lock.yaml
            wwl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in wwl-cbun wwl-ai-chat wwl-hex-earth; do
            echo "::group::Build $pkg"
            if [ "$pkg" = wwl-hex-earth ]; then
              # The pinned Git dependency needs its allowlisted prepack build.
              pnpm install --frozen-lockfile --ignore-scripts=false --dir "$pkg"
            else
              pnpm install --frozen-lockfile --dir "$pkg"
            fi
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm format:check && pnpm lint

      - name: Build site
        run: pnpm build && pnpm docs:check

      - name: Assert tests and smoke demos are not in dist
        run: |
          if [ -d dist/tests ]; then
            echo "dist/tests must not be published" >&2
            exit 1
          fi
          if ls dist/demo/gemma-* >/dev/null 2>&1; then
            echo "dist must not include gemma smoke demos" >&2
            exit 1
          fi
          test ! -d dist/models
          test ! -d dist/qa
          if find dist/assets -name "*WwlLocalEvaluation*" | grep -q .; then
            echo "Local evaluation must not be published" >&2
            exit 1
          fi
