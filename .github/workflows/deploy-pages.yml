name: Deploy static content to Pages

# Labs dogfoods sibling wwl-* repos via link:../wwl-*. Check them out beside
# weekend-web-labs/ and build dist/ (gitignored) before install/build/deploy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weekend-web-labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: weekend-web-labs
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout wwl-cbun
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-cbun
          ref: main
          path: wwl-cbun

      - name: Checkout wwl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-ai-chat
          ref: main
          path: wwl-ai-chat

      - name: Checkout wwl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-hex-earth
          ref: main
          path: wwl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            weekend-web-labs/pnpm-lock.yaml
            wwl-cbun/pnpm-lock.yaml
            wwl-ai-chat/pnpm-lock.yaml
            wwl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in wwl-cbun wwl-ai-chat wwl-hex-earth; do
            echo "::group::Build $pkg"
            if [ "$pkg" = wwl-hex-earth ]; then
              # The pinned Git dependency needs its allowlisted prepack build.
              pnpm install --frozen-lockfile --ignore-scripts=false --dir "$pkg"
            else
              pnpm install --frozen-lockfile --dir "$pkg"
            fi
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: weekend-web-labs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
