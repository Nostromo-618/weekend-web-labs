name: Playwright

# Optional / manual only — keeps default CI cheap.
# Runs Chromium Desktop unit + e2e (same suite previously in CI).
# Trigger from Actions → Playwright → Run workflow.

on:
  workflow_dispatch:

# Labs dogfoods sibling wwl-* repos via link:../wwl-*. Check them out beside
# weekend-web-labs/ and build dist/ (gitignored) before install/test.

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: weekend-web-labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: weekend-web-labs

      - name: Checkout wwl-cbun
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-cbun
          ref: main
          path: wwl-cbun

      - name: Checkout wwl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: nostromo-618/wwl-hex-earth
          ref: main
          path: wwl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            weekend-web-labs/pnpm-lock.yaml
            wwl-cbun/pnpm-lock.yaml
            wwl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in wwl-cbun wwl-hex-earth; do
            echo "::group::Build $pkg"
            if [ "$pkg" = wwl-hex-earth ]; then
              # The pinned Git dependency needs its allowlisted prepack build.
              pnpm install --frozen-lockfile --ignore-scripts=false --dir "$pkg"
            else
              pnpm install --frozen-lockfile --dir "$pkg"
            fi
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright unit + e2e
        run: pnpm exec playwright test --project="Chromium Desktop"
        env:
          CI: true
