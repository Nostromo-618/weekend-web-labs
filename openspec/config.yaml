schema: spec-driven

context: |
  Project: weekend web labs (@wwl/weekend-web-labs) — experimental Vue demo playground.

  Naming (labs-owned):
  - Prefix labs UI/components/CSS/product ids with `wwl` / `Wwl` / `wwl-`
    (e.g. WwlAiChatUI, .wwl-ai-*, wwl-ai-chat).
  - Do NOT rename `@vanduo-oss/vd3` or its design-system API (`VdButton`, `VdCard`,
    `VdModal`, `--vd-*` tokens, `.vd-btn` / `.vd-glass` / etc.). Those stay `vd` / `Vd`.

  Architecture:
  - Engines come from sibling packages: `@wwl/wwl-ai-chat` (`AiChat` + markdown).
    Labs does NOT publish engines and MUST NOT reintroduce local engine SoT forks.
  - Labs Vue shell: Vite + Vue 3 + `@vanduo-oss/vd3` (`src/App.vue`, `src/components/Wwl*.vue`).
  - Guardrails: package subpaths (`…/guardrails/llm`, …).
  - Default AI path: LiteRT Gemma (WebLLM fallback). Inject `loadLiteRT` /
    `loadTransformers` in demos. Local model mirrors under `.models/` (dev-served at
    `/models/…`; never ship into dist). Fetch with `pnpm models:fetch`.

  Key paths:
  - UI: `src/components/WwlAiChatUI.vue`
  - Docs: `doc/wwl-ai-chat.md`, `doc/wwl-guardrails.md`, `README.md`
  - Tests: `tests/unit/*.spec.ts`, `tests/e2e/*.spec.ts` (Playwright)
  - Demos: `demo/*`, `src/demos/*`

  Testing: `pnpm test` (Playwright). Prefer focused unit specs when changing demos/harnesses.

rules:
  proposal:
    - Call out whether the change touches labs `vdl` surface vs `@vanduo-oss/vd3` APIs
    - Prefer small deltas; do not boil the ocean with brownfield backfill
  specs:
    - Use Given/When/Then scenarios for observable behavior
    - Keep `vd3` / design-system references explicit when relevant
  tasks:
    - Include a verification step (`pnpm test` or a focused Playwright/unit file)

operations:
  apply:
    guidance:
      - Prefer focused unit tests before full Playwright when possible
      - Do not commit unless the user asks
  archive:
    guidance:
      - Keep the completion summary concise
