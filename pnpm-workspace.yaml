allowBuilds:
  a: true
  h: true
  p: true
  protobufjs: true
  r: true
  s: true
  sharp: true
  esbuild: true
  onnxruntime-node: true

minimumReleaseAgeExclude:
  - '@wwl/wwl-ai-chat@0.1.0 || 0.1.1'
  - '@vanduo-oss/vd3@1.3.0 || 1.7.5'
  - '@vanduo-oss/vd3-cbun@1.3.1 || 1.3.2'
  - '@vanduo-oss/vd3-charts@1.1.0'

# Security pins (Dependabot): nanoid DoS fix, sharp/libvips, protobufjs RCE/DoS cluster.
# Prefer patched 3.3.17 over brand-new 3.3.18+ (Safe-chain minimumReleaseAge).
overrides:
  nanoid@^3.0.0: 3.3.17
  sharp: '>=0.35.3'
  protobufjs: '>=7.6.3'
